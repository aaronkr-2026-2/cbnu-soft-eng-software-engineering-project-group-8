<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0 0 8px;
        }

        .header p {
            margin: 0;
            opacity: 0.9;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 25px;
            background: #eff6ff;
            border-radius: 12px;
            text-align: center;
            display: none;
        }

        .result h2 {
            margin: 0 0 10px;
        }

        .grade {
            font-size: 42px;
            font-weight: bold;
            color: #1d4ed8;
        }

        .error {
            margin-top: 20px;
            padding: 15px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 8px;
            display: none;
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .container {
                margin: 20px auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Student Performance Predictor</h1>
        <p>AI-based prediction of final student performance</p>
    </div>

    <div class="card">

        <h2>Student Information</h2>

        <form id="predictionForm">

            <div class="grid">

                <div class="field">
                    <label for="school">School</label>
                    <select id="school">
                        <option value="GP">GP</option>
                        <option value="MS">MS</option>
                    </select>
                </div>

                <div class="field">
                    <label for="sex">Gender</label>
                    <select id="sex">
                        <option value="F">Female</option>
                        <option value="M">Male</option>
                    </select>
                </div>

                <div class="field">
                    <label for="age">Age</label>
                    <input type="number" id="age" value="17" min="15" max="22">
                </div>

                <div class="field">
                    <label for="address">Address</label>
                    <select id="address">
                        <option value="U">Urban</option>
                        <option value="R">Rural</option>
                    </select>
                </div>

                <div class="field">
                    <label for="studytime">Study Time</label>
                    <select id="studytime">
                        <option value="1">Less than 2 hours</option>
                        <option value="2" selected>2 to 5 hours</option>
                        <option value="3">5 to 10 hours</option>
                        <option value="4">More than 10 hours</option>
                    </select>
                </div>

                <div class="field">
                    <label for="failures">Past Failures</label>
                    <input type="number" id="failures" value="0" min="0" max="4">
                </div>

                <div class="field">
                    <label for="absences">Absences</label>
                    <input type="number" id="absences" value="4" min="0">
                </div>

                <div class="field">
                    <label for="higher">Wants Higher Education?</label>
                    <select id="higher">
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>

            </div>

            <button type="submit">
                Predict Final Grade
            </button>

        </form>

        <div class="result" id="result">
            <h2>Predicted Final Grade</h2>
            <div class="grade" id="grade">--</div>
            <p>Predicted score out of 20</p>
        </div>

        <div class="error" id="error"></div>

    </div>

</div>

<script>

const form = document.getElementById("predictionForm");
const result = document.getElementById("result");
const grade = document.getElementById("grade");
const error = document.getElementById("error");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    result.style.display = "none";
    error.style.display = "none";

    const studentData = {

        school: document.getElementById("school").value,
        sex: document.getElementById("sex").value,
        age: Number(document.getElementById("age").value),
        address: document.getElementById("address").value,

        famsize: "GT3",
        Pstatus: "A",

        Medu: 4,
        Fedu: 4,

        Mjob: "at_home",
        Fjob: "teacher",

        reason: "course",
        guardian: "mother",

        traveltime: 2,

        studytime: Number(
            document.getElementById("studytime").value
        ),

        failures: Number(
            document.getElementById("failures").value
        ),

        schoolsup: "no",
        famsup: "yes",
        paid: "no",
        activities: "no",
        nursery: "yes",

        higher: document.getElementById("higher").value,

        internet: "yes",
        romantic: "no",

        famrel: 4,
        freetime: 3,
        goout: 3,
        Dalc: 1,
        Walc: 1,
        health: 3,

        absences: Number(
            document.getElementById("absences").value
        )
    };

    try {

        const response = await fetch(
            "http://127.0.0.1:5000/predict",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(studentData)
            }
        );

        if (!response.ok) {
            throw new Error("Prediction request failed.");
        }

        const data = await response.json();

        grade.textContent = data.predicted_grade + " / 20";
        result.style.display = "block";

    } catch (err) {

        error.textContent =
            "Could not connect to the prediction server. Make sure Flask is running.";

        error.style.display = "block";

    }

});

</script>

</body>
</html>
